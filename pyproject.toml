[project]
name = "langfuse-ignitis"
version = "0.1.0"
description = "Self-hosted multi-service agent observability proof of concept"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "langfuse>=4.7,<5", "opentelemetry-instrumentation-fastapi>=0.60b0,<1",
  "pydantic-settings>=2,<3",
]

[project.optional-dependencies]
adk = ["google-adk>=2,<3", "openinference-instrumentation-google-adk>=0.1,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
